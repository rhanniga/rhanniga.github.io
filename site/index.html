<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2E3440" />
    <title>dr. ryan hannigan</title>
    <meta
      name="description"
      content="ryan's website, now with more personality"
    />
    <link rel="canonical" href="https://www.hannigan.sh/" />
    <meta name="author" content="Ryan Hannigan" />

    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="hannigan.sh" />
    <meta property="og:url" content="https://www.hannigan.sh/" />
    <meta
      property="og:title"
      content="dr. ryan hannigan"
    />
    <meta
      property="og:description"
      content="simulated terminal as a quirky interface for my resume, also includes small LLM that runs client-side"
    />
    <meta name="twitter:card" content="summary" />

    <link rel="icon" href="./favicon.ico" sizes="any" />

    <link rel="stylesheet" href="./styles/nord.css" />
    <link rel="stylesheet" href="./styles/theme.css" />
    <link rel="stylesheet" href="./styles/terminal.css" />

    <link rel="modulepreload" href="./js/util.js" />
    <link rel="modulepreload" href="./js/render/chunk.js" />
    <link rel="modulepreload" href="./js/render/layout.js" />
    <link rel="modulepreload" href="./js/render/format.js" />
    <link rel="modulepreload" href="./js/terminal/terminal.js" />
    <link rel="modulepreload" href="./js/terminal/shell-mode.js" />
    <link rel="modulepreload" href="./js/shell/registry.js" />
    <link rel="modulepreload" href="./js/commands/index.js" />
    <link rel="modulepreload" href="./js/terminal/boot.js" />
    <link rel="modulepreload" href="./js/render/announcer.js" />
    <link rel="preload" href="./resume.json" as="fetch" crossorigin />

    <script>
      (function () {
        var on = true;
        try {
          var v = localStorage.getItem("hannigan.sh:crt");
          if (v === "on" || v === "off") on = v === "on";
          else if (
            matchMedia("(prefers-reduced-motion: reduce)").matches ||
            matchMedia("(prefers-contrast: more)").matches
          )
            on = false;
        } catch (e) {
        }
        document.documentElement.dataset.crt = on ? "on" : "off";
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="?plain=1">Skip terminal — view plain resume</a>

    <div id="terminal" data-focused="false" data-booting="true">
      <div class="crt" aria-hidden="true"></div>

      <div class="viewport" id="viewport">
        <div class="output" id="output" aria-hidden="true"></div>
        <div class="inputline" id="inputline" aria-hidden="true" hidden><span class="prompt"></span><span class="line"><span class="line-pre"></span><span class="cursor" data-blink="true">&nbsp;</span><span class="line-post"></span></span></div>

        <textarea
          id="kbd"
          class="kbd-sink"
          rows="1"
          spellcheck="false"
          autocapitalize="off"
          autocomplete="off"
          autocorrect="off"
          inputmode="text"
          enterkeyhint="go"
          aria-label="Terminal input. Type a command and press Enter. Type help for a list of commands."
          aria-describedby="kbd-help"
        ></textarea>
      </div>

      <div class="softkeys" id="softkeys" hidden></div>
    </div>

    <div
      id="announcer"
      class="sr-only"
      role="log"
      aria-live="polite"
      aria-atomic="false"
    ></div>

    <p id="kbd-help" class="sr-only">
    simulated terminal with a few standard unix commands and a few funky commands (including "ask", which lets you ask a client-side LLM questions about me)
    </p>

    <span id="metrics" class="metrics" aria-hidden="true"></span>

    <noscript>
      <div style="padding: 1rem; max-width: 40rem">
        <h1>Dr. Ryan Hannigan</h1>
        <p>
          backend engineering manager who secretly ICs when nobody is looking, i also lecture physics at UT Austin from time to time
        </p>
        <p>
        if you wanna just curl my resume:
          <a href="./resume.json">resume.json</a>.
        </p>
        <ul>
          <li><a href="https://github.com/rhanniga">GitHub: rhanniga</a></li>
          <li>
            <a href="https://linkedin.com/in/astrophysiic">LinkedIn: astrophysiic</a>
          </li>
        </ul>
      </div>
    </noscript>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
