name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege at the workflow level; the deploy job elevates.
permissions:
  contents: read

# Overlapping deploys to a Pages environment race each other.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # FIRST. The workflow this replaces ran actions/cache and
      # `cargo install --locked trunk` *before* checkout, so --locked had no
      # lockfile to read and hashFiles('**/Cargo.lock') hashed an empty
      # workspace -- the primary cache key was degenerate and always fell
      # through to restore-keys.
      - uses: actions/checkout@v4

      # convert.py needs numpy + huggingface_hub. The runner's system pip is
      # externally managed on 24.04, so this is the isolated interpreter rather
      # than a venv hand-rolled in the step below. Everything else here is
      # stdlib, so this is the only reason it exists.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      # The 87 MB of weights are not in git -- see .gitignore -- so they are
      # rebuilt here. convert.py is pure numpy over a bf16 safetensors download,
      # with no torch and no randomness, and it reproduces byte-for-byte: the
      # manifest it generates is identical to the one produced locally, hash for
      # hash. That is what makes caching the .hslm safe and the gate below
      # meaningful.
      #
      # Cached on convert.py's own hash, because the ~270 MB download plus the
      # quantize pass is the only slow part of this workflow. Sharding is
      # stdlib-only and takes about a second, so it is redone every run rather
      # than cached -- which also guarantees m.hslm is on disk for the engine
      # self-checks below.
      - name: Cache the converted model
        uses: actions/cache@v4
        with:
          path: m.hslm
          key: hslm-hybrid-${{ hashFiles('tools/convert.py') }}

      - name: Build the model weights
        env:
          # The model the golden fixtures and the SQNR gate were run against. A
          # mismatch means the upstream weights moved under us, and shipping
          # them would mean serving a model nothing in this repo has tested.
          # Re-verify locally, then update this hash and the fixtures together.
          EXPECTED_SHA: 846760a0ff2c90909cec9a92c65b79162dfe095ca7744d2d513c41554fd25363
        run: |
          if [ ! -f m.hslm ]; then
            pip install --quiet -r tools/requirements.txt
            python3 tools/convert.py --quant hybrid -o m.hslm
          else
            echo "m.hslm restored from cache"
          fi
          python3 tools/shard.py m.hslm --out site/model/
          got=$(jq -r .sha256 site/model/manifest.json)
          if [ "$got" != "$EXPECTED_SHA" ]; then
            echo "::error::model sha256 $got != expected $EXPECTED_SHA"
            exit 1
          fi

      # Build the C -> WASM `ask` engine into the gitignored site/ask/ slot.
      # clang + wasm-ld ship on ubuntu-latest, so this costs ~2s -- compare
      # ~60-120s to install emsdk. Skipped until engine/ exists (M10).
      - name: Build the ask engine
        run: |
          if [ ! -f engine/Makefile ]; then
            echo "engine/ not present yet — skipping (site degrades to grep-mode)"
            exit 0
          fi
          clang --version
          wasm-ld --version || { sudo apt-get update && sudo apt-get install -y lld; }
          make -C engine wasm wasm-scalar OUT=../site/ask
          for f in site/ask/engine.simd.wasm site/ask/engine.wasm; do
            size=$(stat -c%s "$f")
            echo "$f: $size bytes"
            [ "$size" -lt 204800 ] || { echo "::error::$f exceeds 200KB"; exit 1; }
          done

      # Runs the .wasm under node against PyTorch-derived golden logits. Node
      # has full WASM SIMD, a debugger, and no browser.
      # Native is verified against PyTorch separately (engine/tests/check_golden.py,
      # which needs torch and so runs locally). Here the wasm build is checked
      # against the native one token-for-token -- exact, not approximate, because the
      # SIMD kernels are integer-only and must agree bit-for-bit.
      #
      # The weights step above puts m.hslm on disk, so this now runs the full
      # comparison against the exact bytes this deploy publishes rather than
      # skipping it. Still guarded on the file existing, so the step keeps working
      # if the weights step is ever made conditional.
      - name: Engine self-checks
        env:
          HSLM_MODEL: m.hslm
        run: |
          if [ ! -f engine/tests/run_wasm.mjs ]; then
            echo "engine tests not present yet — skipping"
            exit 0
          fi
          make -C engine test
          if [ -n "${HSLM_MODEL:-}" ] && [ -f "$HSLM_MODEL" ]; then
            make -C engine native
            node engine/tests/run_wasm.mjs --model "$HSLM_MODEL" \
              --native ./engine/engine --bench
          else
            echo "HSLM_MODEL not set — skipping the wasm/native comparison"
          fi

      # cards.js is generated from resume.json. Deploying a stale one would have
      # grep-mode quoting a resume that is no longer the resume.
      - name: Grep-mode corpus is current
        run: python3 tools/build_cards.py --check

      # Node's built-in runner, zero dependencies. The bare-directory form
      # (`node --test tests/`) is broken on Node 26 -- no args auto-discovers.
      - name: Unit tests
        run: node --test

      # Exits nonzero if any semantic colour role drops below its WCAG
      # threshold. Several Nord colours fail AA on their own, so the mixes in
      # theme.css are load-bearing rather than decorative.
      - name: Contrast audit
        run: node tools/contrast.mjs

      # With no build step and no CI type checking, a JSON syntax error would
      # otherwise reach production and blank every resume command. jq is
      # preinstalled on ubuntu-latest.
      - name: Verify artifact contents
        run: |
          test -f site/index.html
          test -f site/resume.json
          jq empty site/resume.json
          # A missing CNAME wipes the Pages custom-domain setting on deploy.
          test -f site/CNAME
          echo "CNAME -> $(cat site/CNAME)"
          # ?plain=1 is the crawlable surface, so these are not optional extras.
          test -f site/robots.txt
          test -f site/sitemap.xml
          python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('site/sitemap.xml')"
          # `ask` decides the model is deployed by HEAD-probing this manifest, then
          # fetches every shard it names. A manifest that ships without its shards is
          # therefore worse than no manifest at all, and both were silently absent from
          # the artifact for the first several deploys -- site/model/ is gitignored, so
          # nothing in this job had any reason to notice. Asserted here instead.
          test -f site/model/manifest.json
          jq -r '.shards[] | "\(.name) \(.bytes)"' site/model/manifest.json |
            while read -r name bytes; do
              test -f "site/model/$name"
              [ "$(stat -c%s "site/model/$name")" -eq "$bytes" ] ||
                { echo "::error::site/model/$name is not $bytes bytes"; exit 1; }
            done
          echo "model -> $(jq -r '.model + " (" + (.shards | length | tostring) + " shards, " + (.bytes | tostring) + " bytes)"' site/model/manifest.json)"

      - uses: actions/configure-pages@v5

      # site/ IS the artifact. No staging, no rsync, no exclude list: whatever
      # is in this directory is what gets published, which is what makes
      # "is it public?" answerable by "is it under site/?".
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
